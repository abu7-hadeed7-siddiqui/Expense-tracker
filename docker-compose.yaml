services:
  expense-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: expense-tracker:latest
    container_name: expense-tracker-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - EXPENSE_DB_PATH=/app/data/expenses.db
    volumes:
      - expense_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  expense_data:
    driver: local
