apiVersion: v1
kind: PersistentVolume
metadata:
  name: expense-tracker-pv
  labels:
    type: local
    app: expense-tracker
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/expense-tracker"
    type: DirectoryOrCreate
